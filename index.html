<!-- 會員編輯 Modal - 修正版 -->
<div id="memberModal" class="modal">
    <div class="modal-header">
        <h3>編輯會員</h3>
        <button class="btn-close" onclick="members.closeModal()">✕</button>
    </div>
    <div class="modal-content">
        <!-- ✅ 改成兩行顯示 -->
        <div class="member-info-compact">
            <div class="info-line">
                <span class="info-label">會員 ID</span>
                <span id="modalMemberId" class="info-value"></span>
                <span class="info-label">姓名</span>
                <span id="modalMemberName" class="info-value"></span>
            </div>
            <div class="info-line">
                <span class="info-label">LINE UID</span>
                <span id="modalMemberUid" class="info-value copy-text"></span>
            </div>
        </div>

        <div class="form-group">
            <label>折扣金餘額</label>
            <div class="balance-adjust">
                <input type="number" id="modalBalance" readonly>
                <div class="adjust-buttons">
                    <button onclick="members.adjustBalance(-500)">-500</button>
                    <button onclick="members.adjustBalance(-100)">-100</button>
                    <button onclick="members.adjustBalance(100)">+100</button>
                    <button onclick="members.adjustBalance(500)">+500</button>
                    <button onclick="members.adjustBalance(1000)">+1000</button>
                </div>
                <div class="custom-adjust">
                    <input type="number" id="customAdjust" placeholder="自訂金額 (正負皆可)">
                    <button onclick="members.applyCustomAdjust()">套用</button>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>狀態</label>
            <select id="modalStatus">
                <option value="啟用">啟用</option>
                <option value="停用">停用</option>
            </select>
        </div>

        <div class="form-group">
            <label>備註</label>
            <textarea id="modalNote" rows="3" placeholder="輸入備註..."></textarea>
        </div>
    </div>
    <div class="modal-footer">
        <button class="btn-secondary" onclick="members.closeModal()">取消</button>
        <button class="btn-success" onclick="members.saveMember()">💾 儲存</button>
    </div>
</div>
